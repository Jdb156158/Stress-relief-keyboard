<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f8f8"><meta name="description" content="把杂念，轻轻敲散。16 款立体材质，沉浸式敲击音效，一块属于你的解压键盘。">
<title>Quiet Keys · 解压键盘</title>
<link rel="stylesheet" href="./style.css">
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
</head>
<body>
<main class="app">
<header class="masthead"><a class="brand" href="./" aria-label="Quiet Keys 首页"><span class="brand-icon">▦</span> QUIET KEYS<span class="brand-cn">解压键盘</span></a><div class="header-actions"><button id="sound" class="icon-button" aria-label="静音" title="声音开关"><svg viewBox="0 0 24 24"><path d="M11 4 6 8H3v8h3l5 4zM16 8c2 2 2 6 0 8m3-11c4 4 4 10 0 14"/></svg></button><button id="fullscreen" class="icon-button" aria-label="全屏" title="全屏"><svg viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button></div></header>
<section class="play-area" aria-label="解压键盘">
<div class="scene-heading"><div><p class="eyebrow">A LITTLE MOMENT OF CALM</p><h1 id="theme-title">风荷举</h1><p id="theme-subtitle">一池青绿，把心事放轻。</p></div><div class="view-actions"><button id="lock" aria-pressed="false"><svg viewBox="0 0 24 24"><rect x="6" y="10" width="12" height="11" rx="2"/><path d="M9 10V6a4 4 0 0 1 8 0"/></svg><span>锁定视角</span></button><button id="reset"><svg viewBox="0 0 24 24"><path d="M4 10a8 8 0 1 1 0 5M4 4v6h6"/></svg><span>重置视角</span></button></div></div>
<div id="stage" class="stage"><canvas id="keyboard" aria-label="三维九宫格键盘，使用数字 1 至 9 或 QWE、ASD、ZXC 敲击"></canvas><p id="loading">正在准备你的片刻宁静…</p><div class="stage-caption"><span class="live-dot"></span><span id="press-count">0</span> 次轻敲<span class="caption-divider">/</span><span id="material-type">树脂 · 清脆</span></div></div>
<div class="volume-panel"><button id="volume-mute" aria-label="静音" class="volume-label">音量</button><input id="volume" type="range" min="0" max="100" value="55" aria-label="音量"><output id="volume-value" for="volume">55%</output></div>
<p class="interaction-hint"><span>点击 / 滑过按键</span><i>·</i><span>拖动空白处旋转</span><i>·</i><span class="desktop-hint">Q W E · A S D · Z X C</span><span class="mobile-hint">双指旋转视角</span></p>
</section>
<section class="collection" aria-labelledby="collection-title"><div class="collection-heading"><div><p class="eyebrow">FIND YOUR FEELING</p><h2 id="collection-title">触感收藏</h2></div><span class="collection-count">16 款材质</span></div><div id="themes" class="theme-grid"></div><p class="collection-note"><span>✧</span> 每一种触感，都是一个小小的出走。</p></section>
<footer><span>放空一下，也很好。</span><span>TAKE A BREATH. PRESS A KEY.</span></footer>
<div id="toast" role="status"></div>
</main>
<script type="module" src="./app.js"></script>
</body>
</html>
